<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02020a"/>
      <stop offset="0.5" stop-color="#0c0c18"/>
      <stop offset="1" stop-color="#1a0d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#6c63ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f0fa"/>
      <stop offset="1" stop-color="#a89ef5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines for technical feel -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Eyebrow -->
  <g font-family="JetBrains Mono, monospace" font-size="22" fill="#6c63ff" letter-spacing="6">
    <line x1="80" y1="170" x2="120" y2="170" stroke="#6c63ff" stroke-width="2"/>
    <text x="140" y="178">PORTAFOLIO</text>
  </g>

  <!-- Name -->
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="url(#text)" letter-spacing="-3">
    Leonardo
  </text>
  <text x="80" y="385" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="url(#text)" letter-spacing="-3">
    Gutierrez.
  </text>

  <!-- Role -->
  <text x="80" y="450" font-family="JetBrains Mono, monospace" font-size="26" fill="rgba(240,240,250,0.62)" letter-spacing="2">
    Full-stack engineer
  </text>

  <!-- Tech badges -->
  <g font-family="JetBrains Mono, monospace" font-size="20" fill="#f0f0fa">
    <g transform="translate(80,520)">
      <rect width="120" height="44" rx="22" fill="rgba(108,99,255,0.12)" stroke="rgba(108,99,255,0.3)"/>
      <circle cx="22" cy="22" r="5" fill="#68a063"/>
      <text x="40" y="29">Node.js</text>
    </g>
    <g transform="translate(216,520)">
      <rect width="100" height="44" rx="22" fill="rgba(108,99,255,0.12)" stroke="rgba(108,99,255,0.3)"/>
      <circle cx="22" cy="22" r="5" fill="#61dafb"/>
      <text x="40" y="29">React</text>
    </g>
    <g transform="translate(332,520)">
      <rect width="160" height="44" rx="22" fill="rgba(108,99,255,0.12)" stroke="rgba(108,99,255,0.3)"/>
      <circle cx="22" cy="22" r="5" fill="#3178c6"/>
      <text x="40" y="29">TypeScript</text>
    </g>
    <g transform="translate(508,520)">
      <rect width="170" height="44" rx="22" fill="rgba(108,99,255,0.12)" stroke="rgba(108,99,255,0.3)"/>
      <circle cx="22" cy="22" r="5" fill="#336791"/>
      <text x="40" y="29">PostgreSQL</text>
    </g>
  </g>

  <!-- Decorative HUD card -->
  <g transform="translate(820,180)">
    <rect width="320" height="170" rx="14" fill="rgba(12,12,24,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="22" r="6" fill="#febc2e"/>
    <circle cx="60" cy="22" r="6" fill="#28c840"/>
    <text x="20" y="70" font-family="JetBrains Mono, monospace" font-size="16" fill="#a89ef5">$ npm run build</text>
    <text x="20" y="100" font-family="JetBrains Mono, monospace" font-size="14" fill="#00ff87">✓ Compilado sin errores</text>
    <text x="20" y="130" font-family="JetBrains Mono, monospace" font-size="14" fill="rgba(240,240,250,0.62)">  221.4 kB · gzip 69 kB</text>
    <text x="20" y="155" font-family="JetBrains Mono, monospace" font-size="14" fill="#00d4ff">→ deploy ready</text>
  </g>

  <!-- URL bottom -->
  <text x="80" y="600" font-family="JetBrains Mono, monospace" font-size="18" fill="rgba(240,240,250,0.4)">
    studio251.online
  </text>
</svg>
